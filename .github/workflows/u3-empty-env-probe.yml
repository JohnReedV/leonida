name: U-3 empty environment native probe
on:
  push:
    branches: [codex/u3-empty-env-probe-ci]
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v5
      - name: Compare native and managed environment reads
        shell: ${{ matrix.shell }}
        run: '& ./.github/scripts/u3-empty-env-probe.ps1'
