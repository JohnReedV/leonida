name: P-5 exception clock native Windows validation

on:
  push:
    branches: [codex/p5-wait-clock-ci]

permissions:
  contents: read

concurrency:
  group: p5-wait-clock-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Workspace tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast

  loader:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
      - name: Prepare baseline worktree
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'leonida-p5-clock-baseline'
          git worktree add --detach $baseline e39a3138360b6a980a986ffc6a236d1905773b4c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "P5_BASELINE_DIR=$baseline" >> $env:GITHUB_ENV
      - name: Baseline release loader unit and integration tests (e39a313)
        working-directory: ${{ env.P5_BASELINE_DIR }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p5-clock-baseline-target
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p leonida-loader --lib --tests --release --locked --no-fail-fast -- --nocapture --test-threads=1
      - name: Verify patched release test binaries
        if: ${{ !cancelled() }}
        env:
          # Separate directories prevent baseline executables being reused as patched ones.
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p5-clock-patched-target
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = cargo test -p leonida-loader --lib --tests --release --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          # Require the new clock conversion and sampled-time boundary tests in this build.
          $required = @(
            'console_insn::tests::counter_microseconds_match_wide_arithmetic',
            'console_insn::tests::wait_tracking_uses_sampled_time_and_preserves_boundaries'
          )
          foreach ($name in $required) {
            if ($tests -notcontains ($name + ': test')) {
              throw "Patched release executable is missing required test: $name"
            }
          }
      - name: Patched release loader unit and integration tests
        # Preserve baseline or guard failures while still running all patched test targets.
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p5-clock-patched-target
        run: |
          cargo test -p leonida-loader --lib --tests --release --locked --no-fail-fast -- --nocapture --test-threads=1
