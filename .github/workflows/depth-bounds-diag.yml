name: Depth bounds diagnostic

on:
  workflow_dispatch:
  push:
    branches: [codex/r5-depth-bounds-diag]

permissions:
  contents: read

jobs:
  depth-bounds:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Compare depth clear and depth-writing draw
        run: cargo test -p leonida-gpu --lib --locked pipeline::host::tests::depth_bounds_pipeline_loads_and_filters_draws -- --exact --nocapture --test-threads=1
