name: Release

# A ready-made leonida.exe for players without Rust or git: every push to main whose CI passed
# is published as a release "Build <n>" (tag build-<n>) with leonida-windows-x64.zip. <n> is the
# number of commits up to that one (git rev-list --count), so a checkout can work out the same
# number for itself, and the launcher compares it with the newest release to offer an update.
# A pull request that changes this file, or a run started by hand, builds the zip as an artifact
# and publishes nothing: to publish a build again, re-run its run from the Actions page.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/third-party-licenses.ps1
  workflow_dispatch:

permissions:
  contents: read

# Runs that may publish wait for the one before, so two never race on a tag. GitHub keeps one
# waiting: a newer one replaces it, so a build can be skipped but never published twice.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs the workspace's build scripts and proc macros, so it has a read-only token, and
  # checkout does not leave that token in .git/config.
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      number: ${{ steps.number.outputs.number }}
      sha: ${{ steps.number.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build number
        id: number
        shell: pwsh
        run: |
          $n = git rev-list --count $env:SHA
          if ($LASTEXITCODE -ne 0) { throw 'git rev-list failed' }
          "RELEASE_BUILD_NUMBER=$n" >> $env:GITHUB_ENV
          "RELEASE_BUILD_COMMIT=$env:SHA" >> $env:GITHUB_ENV
          "number=$n" >> $env:GITHUB_OUTPUT
          "sha=$env:SHA" >> $env:GITHUB_OUTPUT
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # RELEASE_BUILD_NUMBER and RELEASE_BUILD_COMMIT are read at compile time by
      # `leonida version`. The C runtime is linked in, so the exe also starts on a PC without
      # the Visual C++ Redistributable.
      - name: Build
        run: cargo build --release --locked -p leonida
        env:
          RUSTFLAGS: -C target-feature=+crt-static
      - name: Check that the exe needs no Visual C++ runtime
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $deps = & $dumpbin.FullName /nologo /dependents target\release\leonida.exe
          if ($LASTEXITCODE -ne 0) { throw 'dumpbin failed' }
          $crt = @($deps | Where-Object { $_ -match '(?i)vcruntime|msvcp|api-ms-win-crt' })
          if ($crt.Count -gt 0) { throw "leonida.exe imports $(($crt.Trim()) -join ', ')" }
          $deps
      - name: Package
        shell: pwsh
        run: |
          $dir = New-Item -ItemType Directory leonida
          Copy-Item target\release\leonida.exe, LICENSE, leonida.example.toml $dir
          ./scripts/third-party-licenses.ps1 -Out (Join-Path $dir 'THIRD-PARTY-LICENSES.txt')
          $source = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:SHA"
          @(
            "build=$env:RELEASE_BUILD_NUMBER",
            "commit=$env:SHA",
            "source=$source"
          ) | Set-Content -Encoding utf8 (Join-Path $dir 'version.txt')
          @(
            "Leonida Legacy, build $env:RELEASE_BUILD_NUMBER",
            '',
            'Double-click leonida.exe. The first time it asks for the folder of your copy of the',
            'game, then offers to warm up the shader cache and starts the game.',
            'Your settings stay in leonida.toml in this folder: copy it into the folder of a newer',
            'build to keep them. leonida.example.toml lists the settings it can hold.',
            '',
            'THIRD-PARTY-LICENSES.txt holds the licences of the libraries built into leonida.exe.',
            "Source code of this build: $source"
          ) | Set-Content -Encoding utf8 (Join-Path $dir 'README.txt')
          Compress-Archive -Path $dir -DestinationPath leonida-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: leonida-windows-x64
          path: leonida-windows-x64.zip
          retention-days: 7

  # The only job with a write token. It runs nothing from the repository: no checkout.
  publish:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ needs.build.outputs.number }}
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leonida-windows-x64
      - name: Publish
        shell: pwsh
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = "build-$env:N"
          # A rewritten main can give a new commit a number that was released already: fail
          # instead of skipping it unseen.
          $tagged = gh api "repos/$repo/commits/$tag" --jq .sha 2> $null
          if ($LASTEXITCODE -eq 0) {
            if ($tagged -ne $env:SHA) { throw "$tag is on $tagged, not on $env:SHA" }
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) { "$tag is published already"; exit 0 }
          }
          # A re-run for an older commit must not become Latest over a newer build.
          $builds = gh release list --repo $repo --limit 1000 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'gh release list failed' }
          $newest = ($builds | ForEach-Object {
            if ($_ -match '^build-(\d+)$') { [int]$Matches[1] }
          } | Measure-Object -Maximum).Maximum
          $latest = '--latest'
          if ($null -ne $newest -and $newest -gt [int]$env:N) { $latest = '--latest=false' }
          $short = $env:SHA.Substring(0, 8)
          $notes = @(
            "Built from $short on main by the Release workflow.",
            '',
            '1. Download leonida-windows-x64.zip below and unpack it.',
            '2. Double-click leonida.exe in the leonida folder.',
            '',
            'Windows 10/11 x64, a CPU with AVX2 and a Direct3D 12 card with shader model 6.6',
            'and mesh shaders. You need your own copy of the game. Windows may warn that the',
            'file is not signed: More info, then Run anyway. With Smart App Control on',
            '(Windows 11), Windows blocks it outright, with no Run anyway.'
          ) -join "`n"
          gh release create $tag leonida-windows-x64.zip --repo $repo --target $env:SHA `
            --title "Build $env:N ($short)" --notes $notes $latest
