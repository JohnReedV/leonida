name: U-3 native graphics settings Windows validation

on:
  push:
    branches: [codex/u3-native-graphics-ci]

permissions:
  contents: read

concurrency:
  group: u3-native-graphics-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  U3_BASELINE_SHA: e8aa6152a4911e6e16e4077e29b9925d93da7b26
  C2_ORIGINAL_TEST: indirect::tests::warp_budget_saturates_without_wraparound_and_preserves_draw_fields
  C2_OLD_ASSERTION: the first two real draws fit the budget
  U3_RUNTIME_MARKER: 'graphics runtime probe: 3 plans matched the title environment'

jobs:
  check:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      c2_failure: ${{ steps.workspace.outputs.c2_failure }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Repository asset policy
        if: ${{ !cancelled() }}
        run: cargo xtask policy
      - name: Workspace tests, every target
        id: workspace
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'u3-workspace.log'
          cargo test --workspace --all-targets --locked --no-fail-fast 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          $text = Get-Content -Raw $log
          $c2 = $testExit -ne 0 -and
            $text -match [regex]::Escape($env:C2_ORIGINAL_TEST) -and
            $text -match [regex]::Escape($env:C2_OLD_ASSERTION)
          "c2_failure=$($c2.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          exit $testExit
      - name: Workspace documentation tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --doc --locked --no-fail-fast

  graphics:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set isolated release target directory
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'leonida-u3-graphics-target'
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
      - name: Verify source and required public CLI tests
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = cargo test -p leonida --test graphics --release --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          foreach ($name in @('graphics_plan_reaches_the_actual_title_environment', 'graphics_validation_precedes_run_reads_and_translation_probing', 'graphics_sources_report_environment_over_config_over_profiles')) {
            if ($tests -notcontains ($name + ': test')) { throw "Missing public CLI test: $name" }
          }
      - name: Default graphics integration suite and actual title sentinel
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'u3-graphics-default.log'
          cargo test -p leonida --test graphics --release --locked -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          if ((Get-Content -Raw $log) -notmatch [regex]::Escape($env:U3_RUNTIME_MARKER)) {
            throw 'The real title environment probe did not execute all three plans.'
          }
      - name: PowerShell integration uses the real default CLI
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/leonida.exe'
          $log = Join-Path $env:RUNNER_TEMP 'u3-powershell.log'
          & ./scripts/test-graphics-settings.ps1 -Exe $exe 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content -Raw $log
          foreach ($marker in @('real native graphics query: passed', 'graphics launcher checks: passed')) {
            if ($text -notmatch [regex]::Escape($marker)) { throw "Missing PowerShell execution marker: $marker" }
          }
      - name: Windows PowerShell 5.1 integration uses the real default CLI
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release/leonida.exe'
          $log = Join-Path $env:RUNNER_TEMP 'u3-powershell51.log'
          & ./scripts/test-graphics-settings.ps1 -Exe $exe 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content -Raw $log
          foreach ($marker in @('real native graphics query: passed', 'graphics launcher checks: passed')) {
            if ($text -notmatch [regex]::Escape($marker)) { throw "Missing PowerShell 5.1 execution marker: $marker" }
          }
      - name: Verify diagnostics WARP presence test
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $tests = cargo test -p leonida --test graphics --release --features diagnostics --locked -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          if ($tests -notcontains 'graphics_warp_presence_never_reports_a_hardware_adapter: test') {
            throw 'Missing diagnostics WARP presence test.'
          }
      - name: Diagnostics graphics integration suite and actual title sentinel
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'u3-graphics-diagnostics.log'
          cargo test -p leonida --test graphics --release --features diagnostics --locked -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $text = Get-Content -Raw $log
          if ($text -notmatch [regex]::Escape($env:U3_RUNTIME_MARKER) -or
              $text -notmatch 'graphics_warp_presence_never_reports_a_hardware_adapter \.\.\. ok') {
            throw 'The diagnostics title probe or WARP presence test did not execute and pass.'
          }

  baseline_c2:
    needs: check
    if: ${{ !cancelled() && github.repository == 'JohnReedV/leonida' && needs.check.outputs.c2_failure == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Set isolated baseline target directory
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'leonida-u3-baseline-target'
          "CARGO_TARGET_DIR=$target" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
      - name: Prepare exact upstream baseline outside checkout
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'leonida-u3-baseline'
          git worktree add --detach $baseline $env:U3_BASELINE_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "U3_BASELINE_DIR=$baseline" >> $env:GITHUB_ENV
      - name: Verify unchanged C2 test source and exact baseline executable
        working-directory: ${{ env.U3_BASELINE_DIR }}
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code $env:U3_BASELINE_SHA HEAD -- crates/leonida-gpu/src/indirect.rs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:GITHUB_WORKSPACE diff --exit-code $env:U3_BASELINE_SHA HEAD -- crates/leonida-gpu/src/indirect.rs
          if ($LASTEXITCODE -ne 0) { throw 'The current C2 source differs from the baseline; investigate before classifying failures.' }
          $tests = cargo test -p leonida-gpu --lib --release --locked $env:C2_ORIGINAL_TEST -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          if ($tests -notcontains ($env:C2_ORIGINAL_TEST + ': test')) { throw 'Missing baseline C2 test.' }
      - name: Observe unchanged baseline C2 scheduling in 32 repetitions
        working-directory: ${{ env.U3_BASELINE_DIR }}
        shell: pwsh
        run: |
          $observed = 0
          for ($round = 1; $round -le 32; $round++) {
            $log = Join-Path $env:RUNNER_TEMP "u3-baseline-c2-$round.log"
            Write-Output "U3_BASELINE_C2_ROUND=$round"
            cargo test -p leonida-gpu --lib --release --locked $env:C2_ORIGINAL_TEST -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
            $testExit = $LASTEXITCODE
            $text = Get-Content -Raw $log
            if ($testExit -eq 0 -and $text -match [regex]::Escape('test result: ok. 1 passed; 0 failed; 0 ignored;')) {
              continue
            }
            if ($testExit -eq 101 -and
                $text -match [regex]::Escape($env:C2_OLD_ASSERTION) -and
                $text -match [regex]::Escape('test result: FAILED. 0 passed; 1 failed; 0 ignored;')) {
              $observed++
              Write-Output "U3_BASELINE_C2_OLD_ASSERTION_FAILURE=$round"
            } else {
              throw "Unexpected baseline C2 result in round $round (exit $testExit)."
            }
          }
          Write-Output "U3_BASELINE_C2_FAILURES=$observed/32; the workspace failure remains visible."
          if ($observed -eq 0) {
            Write-Output 'No baseline failure reproduced in this run; passing legacy tests may silently skip unavailable WARP.'
          }
          exit 0
