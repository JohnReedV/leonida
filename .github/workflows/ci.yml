name: CI

on:
  pull_request:
  push:
    branches: [main, codex/p5-console-instruction-ci]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Baseline loader tests, release
        run: |
          git fetch origin 0a1a17b7e0abf62db5abb6d66cb2c86bf575c579 --depth=1
          git worktree add --detach ../leonida-baseline 0a1a17b7e0abf62db5abb6d66cb2c86bf575c579
          cargo test --manifest-path ../leonida-baseline/Cargo.toml -p leonida-loader --release --locked
      - name: Loader tests, release
        run: cargo test -p leonida-loader --release --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
