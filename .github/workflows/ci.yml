name: P-2 native Windows validation

on:
  push:
    branches: [codex/p2-single-record-ci]

permissions:
  contents: read

concurrency:
  group: p2-single-record-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Workspace tests
        if: ${{ !cancelled() }}
        run: cargo test --workspace --locked --no-fail-fast

  indirect:
    if: github.repository == 'JohnReedV/leonida'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: 'false'
      - name: Prepare baseline worktree
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'leonida-p2-baseline'
          git worktree add --detach $baseline e39a3138360b6a980a986ffc6a236d1905773b4c
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "P2_BASELINE_DIR=$baseline" >> $env:GITHUB_ENV
      - name: Baseline release indirect tests (e39a313)
        working-directory: ${{ env.P2_BASELINE_DIR }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p2-baseline-target
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p leonida-gpu --lib --release --locked indirect:: -- --nocapture --test-threads=1
      - name: Verify patched release test binary
        if: ${{ !cancelled() }}
        env:
          # Never reuse baseline artifacts: Cargo can regard older checkout mtimes as fresh.
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p2-patched-target
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = cargo test -p leonida-gpu --lib --release --locked indirect:: -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests | Write-Output
          $name = 'indirect::tests::warp_single_records_match_grouped_arguments_and_budget'
          if ($tests -notcontains ($name + ': test')) {
            throw "Patched release executable is missing required test: $name"
          }
      - name: Patched release indirect tests, opt-in enabled
        # Keep baseline failures visible while still testing the patched tree.
        # The quality job above tests the ordinary default environment.
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p2-patched-target
          LEONIDA_INDIRECT_SINGLE: '1'
        run: |
          cargo test -p leonida-gpu --lib --release --locked indirect:: -- --nocapture --test-threads=1
      - name: Require executed WARP parity coverage
        if: ${{ !cancelled() }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/leonida-p2-patched-target
          LEONIDA_INDIRECT_SINGLE: '1'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'p2-warp-parity.log'
          cargo test -p leonida-gpu --lib --release --locked indirect::tests::warp_single_records_match_grouped_arguments_and_budget -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }
          $text = Get-Content -Raw $log
          if ($text -notmatch [regex]::Escape('single-record clamp parity: 1624 cases, both pipelines executed')) {
            throw 'WARP parity did not execute all 1624 cases; a skipped or stale test is not a pass.'
          }
          if ($text -notmatch [regex]::Escape('test result: ok. 1 passed; 0 failed; 0 ignored;')) {
            throw 'The exact WARP parity invocation did not report one executed passing test.'
          }
